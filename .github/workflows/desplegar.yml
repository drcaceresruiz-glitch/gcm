# Despliegue a cPanel.
#
# GCM es una aplicacion Next.js: hay que compilarla y reiniciar su proceso
# Node. Se compila aqui y por FTP viaja SOLO UN ARCHIVO comprimido.
#
# Por que un solo archivo y no el arbol suelto: subir los 1452 archivos del
# servidor autocontenido por FTP resulto inviable. FTP los manda de uno en
# uno y sin transacciones, asi que cualquier corte deja la carpeta a medias;
# y `mirror` compara por tamano y fecha, de modo que da por buenos los
# archivos truncados y los salta. Eso produjo un despliegue "en verde" sobre
# una instalacion rota, con errores de "Unexpected end of input" al arrancar.
# Un unico .tar.gz o llega entero o no llega.
#
# Lo descomprime la propia aplicacion al arrancar (ver `arranque.js`), para
# que el despliegue siga siendo automatico y no exija entrar a cPanel.
#
# La configuracion real (DATABASE_URL, APP_SECRET) NO viaja: vive en cPanel,
# en las variables de entorno de la aplicacion Node.
name: Desplegar a cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: despliegue-produccion
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    # Un despliegue sano tarda un par de minutos. Sin este limite, un cuelgue
    # de FTP consume las 6 horas por defecto antes de que nadie se entere:
    # ya paso una vez.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Un presupuesto mal calculado no debe llegar a produccion.
      - name: Pruebas
        run: npx vitest run

      - name: Compilar
        # Valores de relleno, no credenciales. `src/lib/env.ts` valida el
        # entorno al importarse y aborta si falta DATABASE_URL o APP_SECRET;
        # el runner no tiene .env, asi que sin esto el build ni arranca.
        env:
          DATABASE_URL: mysql://compilacion@127.0.0.1:3306/compilacion
          APP_SECRET: relleno-de-compilacion-sin-valor-real-32ch
        run: npm run build

      # `output: "standalone"` deja un servidor autocontenido, pero los
      # estaticos y public quedan fuera y hay que colocarlos en su sitio.
      - name: Armar el paquete
        run: |
          mkdir -p deploy
          # -L dereferencia: el build deja enlaces simbolicos (rimraf y
          # @prisma/client) y el servidor no admite SITE SYMLINK.
          cp -rL .next/standalone/. deploy/
          # El build arrastra el .env dentro de standalone. Fuera: subirlo
          # pisaria la configuracion del servidor con la de desarrollo.
          rm -f deploy/.env deploy/.env.*
          mkdir -p deploy/.next/static
          cp -r .next/static/. deploy/.next/static/
          if [ -d public ]; then cp -r public deploy/public; fi

          mkdir -p envio
          tar -czf envio/gcm.tar.gz -C deploy .
          ls -lh envio/gcm.tar.gz

      # Este archivo es el punto de entrada que ejecuta Passenger. Descomprime
      # el paquete si hay uno pendiente y despues arranca el servidor. Va
      # aparte del .tar.gz a proposito: no puede sobrescribirse a si mismo
      # mientras se esta ejecutando.
      - name: Escribir el arranque
        run: |
          cat > envio/app.js <<'FIN'
          // Punto de entrada en cPanel/Passenger.
          //
          // El despliegue sube un unico gcm.tar.gz y toca tmp/restart.txt.
          // Passenger reinicia, y este archivo descomprime el paquete antes
          // de ceder el control al servidor de Next.
          //
          // Se descomprime aqui y no por FTP porque subir los 1452 archivos
          // sueltos dejaba la instalacion a medias en cuanto se cortaba una
          // conexion, y los archivos truncados pasaban desapercibidos.
          const { existsSync, renameSync, unlinkSync } = require("fs");
          const { execFileSync } = require("child_process");
          const { join } = require("path");

          const paquete = join(__dirname, "gcm.tar.gz");
          const enCurso = join(__dirname, "gcm.tar.gz.desplegando");

          if (existsSync(paquete)) {
            // Se renombra antes de tocarlo: si el proceso muere a mitad, el
            // siguiente arranque no reintenta sobre un archivo incompleto y
            // el fallo queda visible en el log en vez de repetirse en bucle.
            renameSync(paquete, enCurso);
            try {
              execFileSync("tar", ["-xzf", enCurso], { cwd: __dirname });
              unlinkSync(enCurso);
              console.log("[gcm] Paquete desplegado.");
            } catch (e) {
              console.error("[gcm] No se pudo descomprimir:", e.message);
              throw e;
            }
          }

          require("./server.js");
          FIN
          node --check envio/app.js
          echo "OK: app.js es JavaScript valido"

      - name: Comprobar que hay destino
        run: |
          if [ -z "${{ secrets.FTP_SERVER_DIR }}" ]; then
            echo "Falta el secreto FTP_SERVER_DIR. Se aborta para no subir" \
                 "a la raiz del FTP."
            exit 1
          fi

      # Tres archivos en total. El orden importa: primero el paquete, y el
      # restart.txt AL FINAL, porque es lo que dispara el reinicio y no debe
      # llegar antes de que el paquete este completo.
      #
      # ftp:ssl-force        -> control CIFRADO: la contrasena no viaja en claro.
      # ftp:ssl-protect-data -> datos SIN cifrar: este ProFTPD resetea la
      #                         conexion de datos cuando va sobre TLS. Lo que
      #                         viaja es la compilacion de un repo publico.
      - name: Subir por FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

          date -u +"%Y-%m-%dT%H:%M:%SZ" > envio/restart.txt

          # Credenciales por ~/.netrc: no aparecen en la lista de procesos.
          umask 077
          printf 'machine %s\nlogin %s\npassword %s\n' \
            "$FTP_SERVER" "$FTP_USERNAME" "$LFTP_PASSWORD" > ~/.netrc
          chmod 600 ~/.netrc

          lftp -c "
            set cmd:fail-exit true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data false;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set net:max-retries 2;
            set net:timeout 30;
            open '$FTP_SERVER';
            cd '$FTP_SERVER_DIR';
            put envio/gcm.tar.gz -o gcm.tar.gz;
            put envio/app.js -o app.js;
            mkdir -f tmp;
            put envio/restart.txt -o tmp/restart.txt;
            bye
          "

          rm -f ~/.netrc
          echo "Subido. La aplicacion descomprime el paquete al reiniciar."
