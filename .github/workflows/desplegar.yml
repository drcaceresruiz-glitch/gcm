# Despliegue a cPanel.
#
# GCM es una aplicacion Next.js: hay que compilarla y reiniciar su proceso
# Node. Se compila aqui y por FTP viaja SOLO UN ARCHIVO comprimido.
#
# Por que un solo archivo y no el arbol suelto: subir los 1452 archivos del
# servidor autocontenido por FTP resulto inviable. FTP los manda de uno en
# uno y sin transacciones, asi que cualquier corte deja la carpeta a medias;
# y `mirror` compara por tamano y fecha, de modo que da por buenos los
# archivos truncados y los salta. Eso produjo un despliegue "en verde" sobre
# una instalacion rota, con errores de "Unexpected end of input" al arrancar.
# Un unico .tar.gz o llega entero o no llega.
#
# Lo descomprime la propia aplicacion al arrancar (ver `arranque.js`), para
# que el despliegue siga siendo automatico y no exija entrar a cPanel.
#
# La configuracion real (DATABASE_URL, APP_SECRET) NO viaja: vive en cPanel,
# en las variables de entorno de la aplicacion Node.
name: Desplegar a cPanel

on:
  push:
    branches: [main]
    # La aplicacion movil (`movil/`) no forma parte de lo que se despliega
    # aqui: es un APK que se compila aparte y se instala a mano en un
    # telefono. Sin este filtro, cambiar una linea de Kotlin reconstruia GCM
    # entero y lo resubia por FTP —y cada subida es otra tirada de dados con
    # el fallo conocido de que el FTP deja caer archivos—. Se desplegaba
    # produccion para nada, y con riesgo.
    paths-ignore:
      - "movil/**"
      - ".github/workflows/apk-emisor-sms.yml"
  workflow_dispatch:

concurrency:
  group: despliegue-produccion
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    # Un despliegue sano tarda un par de minutos. Sin este limite, un cuelgue
    # de FTP consume las 6 horas por defecto antes de que nadie se entere:
    # ya paso una vez.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Un presupuesto mal calculado no debe llegar a produccion.
      - name: Pruebas
        run: npx vitest run

      - name: Compilar
        # Valores de relleno, no credenciales. `src/lib/env.ts` valida el
        # entorno al importarse y aborta si falta DATABASE_URL o APP_SECRET;
        # el runner no tiene .env, asi que sin esto el build ni arranca.
        env:
          DATABASE_URL: mysql://compilacion@127.0.0.1:3306/compilacion
          APP_SECRET: relleno-de-compilacion-sin-valor-real-32ch
        run: npm run build

      # `output: "standalone"` deja un servidor autocontenido, pero los
      # estaticos y public quedan fuera y hay que colocarlos en su sitio.
      - name: Armar el paquete
        run: |
          mkdir -p deploy
          # -L dereferencia: el build deja enlaces simbolicos (rimraf y
          # @prisma/client) y el servidor no admite SITE SYMLINK.
          cp -rL .next/standalone/. deploy/
          # El build arrastra el .env dentro de standalone. Fuera: subirlo
          # pisaria la configuracion del servidor con la de desarrollo.
          rm -f deploy/.env deploy/.env.*
          mkdir -p deploy/.next/static
          cp -r .next/static/. deploy/.next/static/
          if [ -d public ]; then cp -r public deploy/public; fi

          # Estaticos servidos por APACHE (no por el proceso Node): evita los
          # 503 del limite de concurrencia cuando el navegador pide muchos
          # chunks a la vez en la primera carga. Se exponen en rutas reales
          # `_next/static` con un .htaccess propio que apaga Passenger SOLO en
          # esa carpeta; NO se toca el .htaccess raiz de cPanel. Se cubren las
          # dos ubicaciones posibles del document root (raiz del app y public/).
          # El server Node sigue sirviendo `.next/static` como respaldo.
          htaccess_estaticos() {
            printf '%s\n' \
              '<IfModule mod_passenger.c>' \
              '  PassengerEnabled off' \
              '</IfModule>' \
              '<IfModule mod_headers.c>' \
              '  Header set Cache-Control "public, max-age=31536000, immutable"' \
              '</IfModule>' > "$1/.htaccess"
          }
          mkdir -p deploy/_next/static
          cp -r .next/static/. deploy/_next/static/
          htaccess_estaticos deploy/_next/static
          mkdir -p deploy/public/_next/static
          cp -r .next/static/. deploy/public/_next/static/
          htaccess_estaticos deploy/public/_next/static

          # El esquema y las migraciones viajan con el paquete: sin ellos no
          # se pueden crear las tablas en el servidor, y la base de produccion
          # no acepta conexiones desde fuera, asi que `prisma migrate deploy`
          # solo puede ejecutarse alli.
          #
          # OJO AL `/.` Y AL `mkdir`, que no son adorno. Esto decia
          # `cp -r prisma deploy/prisma`, y como el build de Next ya habia
          # creado `deploy/prisma`, `cp -r` metia el directorio DENTRO: las
          # migraciones acababan en `prisma/prisma/migrations` y al servidor
          # no llegaba ninguna nueva. Costo dos incidentes (10 y 11 de
          # agosto) porque el sintoma enganaba: `migrate status` respondia
          # "up to date" —esta al dia con las que ve— y las que faltaban
          # parecian perdidas por el FTP.
          mkdir -p deploy/prisma
          cp -r prisma/. deploy/prisma/
          # Que el paquete lleve TODAS las migraciones del repositorio no es
          # negociable: si esto vuelve a fallar, que falle aqui y en rojo, no
          # en produccion y en silencio.
          esperadas=$(ls -d prisma/migrations/*/ | wc -l)
          enviadas=$(ls -d deploy/prisma/migrations/*/ | wc -l)
          if [ "$esperadas" != "$enviadas" ]; then
            echo "El paquete lleva $enviadas migraciones y el repositorio tiene $esperadas."
            exit 1
          fi
          echo "Migraciones en el paquete: $enviadas"
          # Crea la empresa y el usuario administrador. Va en JS plano para
          # poder ejecutarse con el Node de cPanel, sin tsx ni devDependencies.
          mkdir -p deploy/scripts
          cp scripts/crear-admin.js deploy/scripts/

          # Prisma 7 lee la URL de la base de un archivo de configuracion, no
          # del esquema. El del repositorio es TypeScript e importa `dotenv` y
          # `prisma/config`, que no existen en el servidor. Se genera aqui una
          # version minima en CommonJS que solo mira la variable de entorno.
          cat > deploy/prisma.config.js <<'FIN'
          module.exports = {
            schema: "prisma/schema.prisma",
            migrations: { path: "prisma/migrations" },
            datasource: { url: process.env.DATABASE_URL },
          };
          FIN
          node --check deploy/prisma.config.js

          mkdir -p envio
          tar -czf envio/gcm.tar.gz -C deploy .
          ls -lh envio/gcm.tar.gz

      # Este archivo es el punto de entrada que ejecuta Passenger. Descomprime
      # el paquete si hay uno pendiente y despues arranca el servidor. Va
      # aparte del .tar.gz a proposito: no puede sobrescribirse a si mismo
      # mientras se esta ejecutando.
      - name: Escribir el arranque
        run: |
          cat > envio/app.js <<'FIN'
          // Punto de entrada en cPanel/LiteSpeed.
          //
          // El despliegue sube un unico gcm.tar.gz y toca tmp/restart.txt. El
          // servidor reinicia, y este archivo descomprime el paquete antes de
          // ceder el control al servidor de Next.
          //
          // Se descomprime aqui y no por FTP porque subir los 1452 archivos
          // sueltos dejaba la instalacion a medias en cuanto se cortaba una
          // conexion, y los archivos truncados pasaban desapercibidos.
          //
          // CANDADO (10 de agosto de 2026, tras una caida de produccion).
          // LiteSpeed levanta VARIAS instancias de la aplicacion. Sin candado,
          // una descomprimia sobre el mismo arbol que otra estaba leyendo, y
          // Node se encontraba los archivos cambiando bajo los pies. Sintomas
          // observados: "Failed to load external module ...wasm-base64.mjs:
          // SyntaxError: Invalid or unexpected token" (un archivo leido a
          // medio escribir), "Failed to find Server Action ... from an older
          // or newer deployment" (mitad de una version y mitad de otra) y
          // "The destination stream closed early". Ahora solo UNA instancia
          // descomprime y las demas esperan a que termine.
          const fs = require("fs");
          const { execFileSync } = require("child_process");
          const { join } = require("path");

          const raiz = __dirname;
          const paquete = join(raiz, "gcm.tar.gz");
          const enCurso = join(raiz, "gcm.tar.gz.desplegando");
          const candado = join(raiz, "tmp", "candado-despliegue");

          // Un candado abandonado no puede bloquear la aplicacion para
          // siempre: si la instancia que lo cogio murio, a los tres minutos
          // cualquiera puede quitarlo.
          const CADUCA_MS = 3 * 60 * 1000;
          const ESPERA_MAX_MS = 2 * 60 * 1000;

          function dormir(ms) {
            // Sincrono a proposito: esto ocurre ANTES de servir nada, y no
            // puede continuarse de forma asincrona sin arrancar el servidor.
            Atomics.wait(new Int32Array(new SharedArrayBuffer(4)), 0, 0, ms);
          }

          function cogerCandado() {
            try {
              fs.mkdirSync(candado); // atomico: solo uno gana
              return true;
            } catch (e) {
              if (e.code !== "EEXIST") throw e;
            }
            try {
              const edad = Date.now() - fs.statSync(candado).mtimeMs;
              if (edad > CADUCA_MS) {
                console.error("[gcm] Candado caducado (" + Math.round(edad / 1000) + "s). Se retoma.");
                fs.rmSync(candado, { recursive: true, force: true });
                fs.mkdirSync(candado);
                return true;
              }
            } catch (e) {
              // Otra instancia lo solto justo ahora: se reintenta en el bucle.
            }
            return false;
          }

          function descomprimir() {
            // Se renombra antes de tocarlo: si el proceso muere a mitad, el
            // siguiente arranque no reintenta sobre un archivo incompleto y
            // el fallo queda visible en el log en vez de repetirse en bucle.
            fs.renameSync(paquete, enCurso);
            execFileSync("tar", ["-xzf", enCurso], { cwd: raiz });
            fs.unlinkSync(enCurso);
            console.log("[gcm] Paquete desplegado.");
          }

          if (fs.existsSync(paquete)) {
            fs.mkdirSync(join(raiz, "tmp"), { recursive: true });
            const hasta = Date.now() + ESPERA_MAX_MS;
            let hecho = false;

            while (!hecho && Date.now() < hasta) {
              if (cogerCandado()) {
                try {
                  // Puede haberlo descomprimido otra instancia mientras se
                  // esperaba: si ya no esta el paquete, no hay nada que hacer.
                  if (fs.existsSync(paquete)) descomprimir();
                  hecho = true;
                } catch (e) {
                  console.error("[gcm] No se pudo descomprimir:", e.message);
                  throw e;
                } finally {
                  fs.rmSync(candado, { recursive: true, force: true });
                }
              } else if (!fs.existsSync(paquete)) {
                console.log("[gcm] Otra instancia ya desplego el paquete.");
                hecho = true;
              } else {
                dormir(250);
              }
            }

            if (!hecho) {
              // Arrancar con el arbol a medias es peor que no arrancar: se
              // veria media version y media otra, que es justo lo que se
              // quiere evitar.
              throw new Error("[gcm] Se agoto la espera del candado de despliegue.");
            }
          }

          // Que compilacion es esta, para que `/api/health` pueda decirlo.
          //
          // Se pone AQUI y no en el entorno de cPanel porque el que despliega
          // es el workflow, no el panel. El 12 de agosto se perdio media hora
          // deduciendo que version estaba viva a partir de la fecha de
          // `server.js`, que es adivinar: con esto se pregunta y se responde.
          process.env.BUILD_SHA = "__BUILD_SHA__";

          require("./server.js");
          FIN
          # El heredoc va entrecomillado para que nada de dentro se expanda,
          # asi que el SHA se sustituye despues.
          sed -i "s/__BUILD_SHA__/${GITHUB_SHA}/" envio/app.js
          node --check envio/app.js
          echo "OK: app.js es JavaScript valido (build ${GITHUB_SHA})"

      - name: Comprobar que hay destino
        run: |
          if [ -z "${{ secrets.FTP_SERVER_DIR }}" ]; then
            echo "Falta el secreto FTP_SERVER_DIR. Se aborta para no subir" \
                 "a la raiz del FTP."
            exit 1
          fi

      # Tres archivos en total. El orden importa: primero el paquete, y el
      # restart.txt AL FINAL, porque es lo que dispara el reinicio y no debe
      # llegar antes de que el paquete este completo.
      #
      # ftp:ssl-force        -> control CIFRADO: la contrasena no viaja en claro.
      # ftp:ssl-protect-data -> datos SIN cifrar: este ProFTPD resetea la
      #                         conexion de datos cuando va sobre TLS. Lo que
      #                         viaja es la compilacion de un repo publico.
      - name: Subir por FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

          date -u +"%Y-%m-%dT%H:%M:%SZ" > envio/restart.txt

          # Credenciales por ~/.netrc: no aparecen en la lista de procesos.
          umask 077
          printf 'machine %s\nlogin %s\npassword %s\n' \
            "$FTP_SERVER" "$FTP_USERNAME" "$LFTP_PASSWORD" > ~/.netrc
          chmod 600 ~/.netrc

          lftp -c "
            set cmd:fail-exit true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data false;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set net:max-retries 2;
            set net:timeout 30;
            open '$FTP_SERVER';
            cd '$FTP_SERVER_DIR';
            put envio/gcm.tar.gz -o gcm.tar.gz;
            put envio/app.js -o app.js;
            mkdir -f tmp;
            put envio/restart.txt -o tmp/restart.txt;
            bye
          "

          rm -f ~/.netrc
          echo "Subido. La aplicacion descomprime el paquete al reiniciar."
