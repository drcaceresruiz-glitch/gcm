# Despliegue a cPanel.
#
# GCM es una aplicacion Next.js: hay que compilarla y reiniciar su proceso
# Node. Se compila aqui y por FTP viaja SOLO UN ARCHIVO comprimido.
#
# Por que un solo archivo y no el arbol suelto: subir los 1452 archivos del
# servidor autocontenido por FTP resulto inviable. FTP los manda de uno en
# uno y sin transacciones, asi que cualquier corte deja la carpeta a medias;
# y `mirror` compara por tamano y fecha, de modo que da por buenos los
# archivos truncados y los salta. Eso produjo un despliegue "en verde" sobre
# una instalacion rota, con errores de "Unexpected end of input" al arrancar.
# Un unico .tar.gz o llega entero o no llega.
#
# Lo descomprime la propia aplicacion al arrancar (ver `arranque.js`), para
# que el despliegue siga siendo automatico y no exija entrar a cPanel.
#
# La configuracion real (DATABASE_URL, APP_SECRET) NO viaja: vive en cPanel,
# en las variables de entorno de la aplicacion Node.
name: Desplegar a cPanel

on:
  push:
    branches: [main]
    # La aplicacion movil (`movil/`) no forma parte de lo que se despliega
    # aqui: es un APK que se compila aparte y se instala a mano en un
    # telefono. Sin este filtro, cambiar una linea de Kotlin reconstruia GCM
    # entero y lo resubia por FTP —y cada subida es otra tirada de dados con
    # el fallo conocido de que el FTP deja caer archivos—. Se desplegaba
    # produccion para nada, y con riesgo.
    paths-ignore:
      - "movil/**"
      - ".github/workflows/apk-emisor-sms.yml"
  workflow_dispatch:

concurrency:
  group: despliegue-produccion
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    # RED DE SEGURIDAD, NO EL FRENO PRINCIPAL. Sin este limite, un cuelgue de
    # FTP consume las 6 horas por defecto antes de que nadie se entere.
    #
    # No se sube, y esto va medido, no supuesto. Un despliegue sano tarda
    # 1,8 min y el reparto es: pruebas 0,2 (las 2139 enteras), compilar 0,7,
    # subir 0,4. Lo demas es ruido. El run #324 (2026-08-17) murio a los
    # 20m14s y NO fue por crecimiento: fue el paso de FTP colgado 18m52s sin
    # imprimir una sola linea. Subir este numero no habria desplegado nada;
    # solo habria alargado el cuelgue.
    #
    # Por eso el freno de verdad esta EN CADA PASO que puede colgarse (ver
    # "Subir por FTPS"). Este de aqui solo cubre lo que no tenga tope propio.
    #
    # Cuando toque subirlo sera por las pruebas, y se vera venir: a 15
    # segundos las 2139, harian falta unas cuarenta veces mas para que
    # asomen por aqui.
    #
    # EL 2026-08-20 ENTRARON DOS PASOS y el reparto cambia, asi que se recalcula
    # aqui en vez de dejar el numero de antes fingiendo que sigue valiendo:
    # lint (~0,5 min) y la comprobacion de `/api/health`, que en un despliegue
    # sano contesta a la primera o segunda pasada —menos de un minuto— pero
    # espera hasta 7 antes de rendirse. Peor caso del camino que LLEGA aqui:
    # ~9 min. Los 8 del tope de FTP no se suman, porque si ese salta el job
    # termina ahi y la comprobacion no llega a correr. Sigue sobrando margen.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # El README dice que la regla «los componentes no importan Prisma» esta
      # «impuesta por ESLint, no solo por convencion». Hasta hoy eso no era
      # cierto AQUI: el CI corria pruebas y build, y el gancho de pre-push
      # typecheck, pruebas y build. Lint no lo ejecutaba nada automaticamente,
      # asi que la regla de arquitectura dependia de que alguien se acordara.
      #
      # `next build` si comprueba los tipos, de modo que typecheck esta cubierto
      # de hecho; ESLint no lo estaba. Va ANTES de las pruebas porque tarda medio
      # minuto y un import prohibido no merece esperar a la bateria entera.
      - name: Lint
        run: npm run lint

      # Un presupuesto mal calculado no debe llegar a produccion.
      - name: Pruebas
        run: npx vitest run

      - name: Compilar
        # Valores de relleno, no credenciales. `src/lib/env.ts` valida el
        # entorno al importarse y aborta si falta DATABASE_URL o APP_SECRET;
        # el runner no tiene .env, asi que sin esto el build ni arranca.
        env:
          DATABASE_URL: mysql://compilacion@127.0.0.1:3306/compilacion
          APP_SECRET: relleno-de-compilacion-sin-valor-real-32ch
        run: npm run build

      # `output: "standalone"` deja un servidor autocontenido, pero los
      # estaticos y public quedan fuera y hay que colocarlos en su sitio.
      - name: Armar el paquete
        run: |
          mkdir -p deploy
          # -L dereferencia: el build deja enlaces simbolicos (rimraf y
          # @prisma/client) y el servidor no admite SITE SYMLINK.
          cp -rL .next/standalone/. deploy/
          # El build arrastra el .env dentro de standalone. Fuera: subirlo
          # pisaria la configuracion del servidor con la de desarrollo.
          rm -f deploy/.env deploy/.env.*
          mkdir -p deploy/.next/static
          cp -r .next/static/. deploy/.next/static/
          if [ -d public ]; then cp -r public deploy/public; fi

          # Estaticos servidos por APACHE (no por el proceso Node): evita los
          # 503 del limite de concurrencia cuando el navegador pide muchos
          # chunks a la vez en la primera carga. Se exponen en rutas reales
          # `_next/static` con un .htaccess propio que apaga Passenger SOLO en
          # esa carpeta; NO se toca el .htaccess raiz de cPanel. Se cubren las
          # dos ubicaciones posibles del document root (raiz del app y public/).
          # El server Node sigue sirviendo `.next/static` como respaldo.
          htaccess_estaticos() {
            printf '%s\n' \
              '<IfModule mod_passenger.c>' \
              '  PassengerEnabled off' \
              '</IfModule>' \
              '<IfModule mod_headers.c>' \
              '  Header set Cache-Control "public, max-age=31536000, immutable"' \
              '</IfModule>' > "$1/.htaccess"
          }
          mkdir -p deploy/_next/static
          cp -r .next/static/. deploy/_next/static/
          htaccess_estaticos deploy/_next/static
          mkdir -p deploy/public/_next/static
          cp -r .next/static/. deploy/public/_next/static/
          htaccess_estaticos deploy/public/_next/static

          # El esquema y las migraciones viajan con el paquete: sin ellos no
          # se pueden crear las tablas en el servidor, y la base de produccion
          # no acepta conexiones desde fuera, asi que `prisma migrate deploy`
          # solo puede ejecutarse alli.
          #
          # OJO AL `/.` Y AL `mkdir`, que no son adorno. Esto decia
          # `cp -r prisma deploy/prisma`, y como el build de Next ya habia
          # creado `deploy/prisma`, `cp -r` metia el directorio DENTRO: las
          # migraciones acababan en `prisma/prisma/migrations` y al servidor
          # no llegaba ninguna nueva. Costo dos incidentes (10 y 11 de
          # agosto) porque el sintoma enganaba: `migrate status` respondia
          # "up to date" —esta al dia con las que ve— y las que faltaban
          # parecian perdidas por el FTP.
          mkdir -p deploy/prisma
          cp -r prisma/. deploy/prisma/
          # Que el paquete lleve TODAS las migraciones del repositorio no es
          # negociable: si esto vuelve a fallar, que falle aqui y en rojo, no
          # en produccion y en silencio.
          esperadas=$(ls -d prisma/migrations/*/ | wc -l)
          enviadas=$(ls -d deploy/prisma/migrations/*/ | wc -l)
          if [ "$esperadas" != "$enviadas" ]; then
            echo "El paquete lleva $enviadas migraciones y el repositorio tiene $esperadas."
            exit 1
          fi
          echo "Migraciones en el paquete: $enviadas"
          # Crea la empresa y el usuario administrador. Va en JS plano para
          # poder ejecutarse con el Node de cPanel, sin tsx ni devDependencies.
          mkdir -p deploy/scripts
          cp scripts/crear-admin.js deploy/scripts/

          # Prisma 7 lee la URL de la base de un archivo de configuracion, no
          # del esquema. El del repositorio es TypeScript e importa `dotenv` y
          # `prisma/config`, que no existen en el servidor. Se genera aqui una
          # version minima en CommonJS que solo mira la variable de entorno.
          cat > deploy/prisma.config.js <<'FIN'
          module.exports = {
            schema: "prisma/schema.prisma",
            migrations: { path: "prisma/migrations" },
            datasource: { url: process.env.DATABASE_URL },
          };
          FIN
          node --check deploy/prisma.config.js

          # El SHA viaja DENTRO del paquete, y no solo en `app.js`.
          #
          # `app.js` se sube aparte y el FTP lo deja en su sitio ANTES de que
          # nadie aplique el `gcm.tar.gz`, asi que su SHA cambia aunque el
          # paquete se quede sin aplicar. El 2026-08-15 eso hizo que
          # `/api/health` cantara la version nueva mientras corria la vieja, y
          # no habia forma de verlo con un curl.
          #
          # Este archivo llega al arbol vivo por el MISMO camino que el codigo:
          # si el codigo esta, esto esta. `/api/health` lo publica como
          # `version` y compara con el del arranque.
          printf '%s' "${GITHUB_SHA}" > deploy/BUILD_SHA

          mkdir -p envio
          tar -czf envio/gcm.tar.gz -C deploy .
          ls -lh envio/gcm.tar.gz

      # El punto de entrada que ejecuta Passenger. Va aparte del .tar.gz a
      # proposito: no puede sobrescribirse a si mismo mientras se ejecuta.
      - name: Escribir el arranque
        run: |
          cat > envio/app.js <<'FIN'
          // Punto de entrada en cPanel/LiteSpeed.
          //
          // NO DESCOMPRIME NADA, Y ESO ES EL ARREGLO. Hasta el 12 de agosto
          // de 2026 este archivo extraia aqui el gcm.tar.gz, y son 16
          // segundos medidos: LiteSpeed mata el arranque mucho antes. De ahi
          // salieron las dos caidas de produccion —el 10, con todos los
          // despliegues del dia sin aplicar y el arbol mezclando dos
          // compilaciones; y el 11, con el login devolviendo 404 porque el
          // manifiesto de acciones era de una version y el JavaScript de
          // otra—. La regla, que ya estaba escrita y se incumplia aqui
          // mismo: **nada lento en el arranque, este hosting lo corta.**
          //
          // Ahora aplica el paquete `desplegar.sh`, que lanza un cron cada
          // minuto. Un cron no tiene cronometro: descomprime aparte,
          // comprueba que el paquete trae `server.js` y `.next`, y solo
          // entonces intercambia con renombrados, que son instantaneos.
          //
          // Con el cron mandando, el candado que habia aqui sobra y ademas
          // estorbaba: los dos usaban el MISMO directorio de candado con
          // caducidades distintas —tres minutos este, diez el script—, asi
          // que este podia quitarle el candado al otro a mitad de un
          // intercambio.
          const fs = require("fs");
          const { join } = require("path");

          // Si hay un paquete esperando, es que el cron no esta haciendo su
          // trabajo: o no se creo, o esta fallando. Se grita en el log en vez
          // de descomprimirlo por nuestra cuenta, que es justo lo que
          // tumbaba el arranque. `/api/health` lo dice tambien, para poder
          // verlo sin entrar al servidor.
          for (const pendiente of ["gcm.tar.gz", "gcm.tar.gz.desplegando"]) {
            if (fs.existsSync(join(__dirname, pendiente))) {
              console.error(
                "[gcm] Hay un " + pendiente + " sin aplicar. Revisa el cron de " +
                  "desplegar.sh y tmp/despliegue.log: esta version NO es la ultima.",
              );
            }
          }

          // Que compilacion es esta, para que `/api/health` pueda decirlo.
          //
          // Se pone AQUI y no en el entorno de cPanel porque el que despliega
          // es el workflow, no el panel. El 12 de agosto se perdio media hora
          // deduciendo que version estaba viva a partir de la fecha de
          // `server.js`, que es adivinar: con esto se pregunta y se responde.
          process.env.BUILD_SHA = "__BUILD_SHA__";

          require("./server.js");
          FIN
          # El heredoc va entrecomillado para que nada de dentro se expanda,
          # asi que el SHA se sustituye despues.
          sed -i "s/__BUILD_SHA__/${GITHUB_SHA}/" envio/app.js
          node --check envio/app.js
          echo "OK: app.js es JavaScript valido (build ${GITHUB_SHA})"

      - name: Comprobar que hay destino
        run: |
          if [ -z "${{ secrets.FTP_SERVER_DIR }}" ]; then
            echo "Falta el secreto FTP_SERVER_DIR. Se aborta para no subir" \
                 "a la raiz del FTP."
            exit 1
          fi

      # Cuatro archivos, y el ORDEN es parte del diseno.
      #
      # Quien aplica el paquete es `desplegar.sh`, que un cron del servidor
      # lanza cada minuto y que actua en cuanto ve un `gcm.tar.gz`. De ahi las
      # dos reglas:
      #
      # 0. **LOS SCRIPTS TAMBIEN se suben con otro nombre y se renombran.** Esto
      #    faltaba, y costo un despliegue el 12 de agosto: `desplegar.sh` se
      #    sobrescribia EN EL SITIO mientras un cron lo ejecuta cada minuto.
      #    Bash lee el archivo por POSICION segun avanza, asi que si la subida
      #    cae a mitad de una ejecucion, el proceso sigue leyendo desplazado
      #    dentro de un archivo que ya no es el mismo: aplico el paquete con las
      #    partes viejas y se salto entero el bloque de migraciones, sin dejar
      #    una sola linea en la bitacora. Sintoma: version nueva sirviendo,
      #    columna nueva inexistente y el panel en 500.
      #
      #    Renombrar lo arregla porque `mv` cambia la entrada del directorio:
      #    quien ya estaba ejecutando conserva su archivo abierto y termina en
      #    paz, y la siguiente pasada del cron coge el nuevo. Hay un instante en
      #    que el archivo no existe —entre el `rm` y el `mv`— y no importa: esa
      #    pasada del cron no encuentra el script, no hace nada, y a la
      #    siguiente ya esta. Es la misma tecnica que el paquete usaba desde el
      #    principio; simplemente no se le habia aplicado a los scripts.
      # 1. **El paquete se sube con otro nombre y se renombra al final.**
      #    Durante la subida de 20 MB el archivo YA EXISTE y esta a medias; si
      #    se subiera directamente como `gcm.tar.gz`, el cron lo cogeria a
      #    mitad y fallaria al descomprimir. El renombrado es instantaneo: el
      #    paquete aparece entero o no aparece.
      # 2. **Ya no se sube `tmp/restart.txt`.** Antes era lo que disparaba el
      #    reinicio para que `app.js` descomprimiera. Ahora el reinicio se
      #    pide DESPUES del intercambio, y lo hace el propio script: subirlo
      #    aqui reiniciaria antes de haber aplicado nada.
      #
      # QUE certificado presenta el servidor. No bloquea: es diagnostico.
      #
      # Existe porque el paso siguiente ya SI verifica, y una verificacion que
      # falla sin decir por que convierte un despliegue en una tarde de
      # adivinanzas. Con esto, justo encima del fallo queda escrito si el
      # certificado esta a nombre de otro, si caduco, o si lo firma una CA que
      # el runner no conoce — que son los tres motivos, y cada uno se arregla
      # distinto.
      - name: Ver que certificado presenta el FTPS
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          TLS="$(openssl s_client -connect "$FTP_SERVER:21" -starttls ftp \
                   -servername "$FTP_SERVER" </dev/null 2>&1 || true)"

          if printf '%s' "$TLS" | grep -q "BEGIN CERTIFICATE"; then
            printf '%s' "$TLS" | openssl x509 -noout \
              -subject -issuer -dates -fingerprint -sha256 2>/dev/null || true
            printf '%s' "$TLS" | grep -E "Verify return code" || true
          else
            echo "No se pudo negociar TLS en el puerto 21. Ultimas lineas:"
            printf '%s' "$TLS" | tail -n 5
          fi

      # ftp:ssl-force        -> control CIFRADO: la contrasena no viaja en claro.
      # ftp:ssl-protect-data -> datos SIN cifrar: este ProFTPD resetea la
      #                         conexion de datos cuando va sobre TLS. Lo que
      #                         viaja es la compilacion de un repo publico.
      # ssl:verify-certificate -> se comprueba QUIEN esta al otro lado.
      #
      # ESO ULTIMO DECIA `no` HASTA HOY, y no era un detalle. Cifrar sin
      # verificar deja el canal de control cifrado pero SIN AUTENTICAR: quien
      # se ponga en medio presenta su propio certificado, lftp lo acepta sin
      # rechistar, y por ese canal viaja la CONTRASENA DEL FTP DE PRODUCCION.
      # Que los datos vayan en claro esta razonado arriba —es la compilacion de
      # un repo publico— pero la credencial es otra cosa.
      #
      # Aqui se falla CERRADO, al reves que las migraciones de `desplegar.sh`:
      # alli seguir adelante sin migrar deja las cosas como estaban, y aqui
      # seguir adelante sin verificar es exactamente el agujero que se cierra.
      # Si esto tumba el despliegue, la version viva sigue sirviendo.
      #
      # LO QUE PASO DE VERDAD AL ENCENDER ESTO, que no es lo que se esperaba y
      # por eso queda escrito. lftp dijo:
      #
      #     Certificate verification: The certificate is NOT trusted.
      #     The certificate issuer is unknown.
      #
      # El certificado del servidor es BUENO —Let's Encrypt, en vigor, y a
      # nombre del host al que se conecta—, pero ProFTPD **no manda su
      # certificado intermedio**. Sin ese eslabon no se puede llegar desde la
      # hoja hasta la raiz que el runner si tiene, y el diagnostico de arriba
      # ya lo cantaba: `Verify return code: 21 (unable to verify the first
      # certificate)`.
      #
      # ARREGLO: el intermedio va en el secreto `FTP_CA_PEM` y se anade al
      # almacen. Se saca del sitio que indica el propio certificado, su
      # extension AIA — «CA Issuers - URI: http://yr1.i.lencr.org/» —, se
      # convierte con `openssl x509 -inform DER`, y ese texto es el secreto.
      # Un certificado de CA es publico: no es una credencial.
      #
      # CUANDO CADUQUE O ROTE el intermedio, esto volvera a fallar en rojo y el
      # paso de diagnostico dira el nombre del nuevo emisor. Es un minuto de
      # trabajo cada varios meses, y a cambio la contrasena del FTP deja de
      # viajar contra un extremo sin verificar.
      #
      # Y SI ALGUNA VEZ EL FALLO ES OTRO, hay un segundo motivo posible que se
      # arregla distinto: un certificado a nombre de OTRO host —tipico en
      # cPanel, conectarse a `ftp.midominio.com` cuando el certificado es de
      # `servidorNN.hosting.com`—. Ahi anclarlo NO sirve, porque el nombre se
      # comprueba igual: hay que apuntar `FTP_SERVER` al nombre que figura en
      # el certificado. Se distinguen por el mensaje: «issuer is unknown» es
      # cadena incompleta; uno que hable del nombre es lo otro.
      #
      # Lo que no es respuesta a ninguno de los dos es apagar la comprobacion.
      #
      # EL TOPE DE ESTE PASO ES EL QUE IMPORTA. Subir tarda 0,4 min, y el
      # 2026-08-17 este paso se colgo 18m52s EN SILENCIO —ni un reintento ni
      # un error en la bitacora— hasta que el reloj del job lo mato. Con un
      # solo commit en vuelo eso deja el codigo sin desplegar sin que nadie se
      # entere, porque el listado de runs solo enseña un icono gris.
      #
      # Ocho minutos son veinte veces lo que tarda: si se pasa de ahi no es
      # lentitud, es un cuelgue. Que muera aqui y en rojo.
      - name: Subir por FTPS
        timeout-minutes: 8
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_CA_PEM: ${{ secrets.FTP_CA_PEM }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          # TOPES DE DENTRO, mas cortos que el del paso (8 min) a proposito: si
          # salta el de GitHub, el mensaje es «The operation was canceled» y
          # hay que adivinar QUE se colgo —el 17/08 se perdio un rato en eso—.
          # Saltando estos primero, la bitacora dice el nombre.
          #
          # Y CON REINTENTOS, que es la leccion del 18/08: la primera version
          # de esto ponia un tope seco de 180 s a `apt-get` y el despliegue
          # murio con «exit code 124» a pelo, sin una linea que explicara por
          # que. No fue un cuelgue: fue un mirror de Ubuntu lento un rato. Un
          # tope sin reintento convierte una lentitud pasajera en un
          # despliegue perdido, y ademas mudo.
          instalar_lftp() {
            for intento in 1 2 3; do
              if sudo timeout 120 apt-get update -qq &&
                 sudo timeout 120 apt-get install -y -qq lftp; then
                return 0
              fi
              echo "Intento $intento: apt no respondio a tiempo. Se reintenta."
              sleep 10
            done
            return 1
          }

          if ! instalar_lftp; then
            echo "No se pudo instalar lftp en el runner despues de tres" \
                 "intentos: apt esta caido o muy lento. NO se ha desplegado" \
                 "nada y la version viva sigue sirviendo. Relanzar el" \
                 "workflow suele bastar."
            exit 1
          fi

          # Credenciales por ~/.netrc: no aparecen en la lista de procesos.
          umask 077
          printf 'machine %s\nlogin %s\npassword %s\n' \
            "$FTP_SERVER" "$FTP_USERNAME" "$LFTP_PASSWORD" > ~/.netrc
          chmod 600 ~/.netrc

          # El borrado va en un `trap` y no al final del script porque ahora
          # hay caminos que NO llegan al final: el tope de lftp sale por su
          # cuenta. Entre comillas simples para que `$ANCLA` se resuelva al
          # salir, no aqui, que todavia no existe.
          #
          # (De paso: la linea de borrado decia `.ftp-ca.pem` y el archivo se
          # llama `.ftp-anclas.pem`, asi que el ancla nunca se borraba. No era
          # grave —un certificado de CA es publico, y el runner se destruye—
          # pero el borrado que no borra es de las cosas que se creen hechas.)
          trap 'rm -f ~/.netrc "$ANCLA"' EXIT

          # Contra QUE se verifica: el almacen de CA del runner, MAS lo que
          # traiga `FTP_CA_PEM`. Se ANADE, no se sustituye: asi el certificado
          # extra cubre el hueco concreto de este hosting sin dejar de confiar
          # en las CA publicas, y el dia que el servidor se arregle esto sigue
          # funcionando sin tocar nada.
          ANCLA="$HOME/.ftp-anclas.pem"
          cp /etc/ssl/certs/ca-certificates.crt "$ANCLA"

          if [ -n "${FTP_CA_PEM:-}" ]; then
            printf '%s\n' "$FTP_CA_PEM" >> "$ANCLA"
            echo "Ancla de confianza: almacen del sistema + FTP_CA_PEM."
          else
            echo "Ancla de confianza: solo el almacen del sistema."
          fi

          # `set +e` para poder MIRAR el codigo de salida: con `-e` el script
          # se iria sin decir si fue un fallo de FTP o un cuelgue, que se
          # arreglan distinto.
          #
          # INT primero y KILL veinte segundos despues: a lftp se le pide que
          # cierre en paz —para que no deje una sesion a medias en el
          # servidor— y si no atiende, se le mata.
          set +e
          timeout --signal=INT --kill-after=20s 240 lftp -c "
            set cmd:fail-exit true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data false;
            set ssl:verify-certificate true;
            set ssl:ca-file '$ANCLA';
            set ftp:passive-mode true;
            set net:max-retries 2;
            set net:timeout 30;
            open '$FTP_SERVER';
            cd '$FTP_SERVER_DIR';
            mkdir -f tmp;
            put scripts/desplegar.sh -o desplegar.sh.subiendo;
            rm -f desplegar.sh;
            mv desplegar.sh.subiendo desplegar.sh;
            put scripts/avisos.sh -o avisos.sh.subiendo;
            rm -f avisos.sh;
            mv avisos.sh.subiendo avisos.sh;
            put envio/app.js -o app.js.subiendo;
            rm -f app.js;
            mv app.js.subiendo app.js;
            put envio/gcm.tar.gz -o gcm.tar.gz.subiendo;
            rm -f gcm.tar.gz;
            mv gcm.tar.gz.subiendo gcm.tar.gz;
            bye
          "
          codigo=$?
          set -e

          # 124 es lo que devuelve `timeout` cuando corta. Se distingue a
          # proposito del resto: un fallo de lftp trae su mensaje encima y se
          # lee; un cuelgue no deja NADA escrito —es lo que hizo perder el
          # despliegue del 17/08— asi que el mensaje lo ponemos aqui.
          if [ "$codigo" = 124 ] || [ "$codigo" = 137 ]; then
            echo "El FTP se colgo: 4 minutos sin terminar, cuando sube en 25" \
                 "segundos. El paquete NO se aplica a medias —viaja con nombre" \
                 "provisional y se renombra al final, y el cron solo mira el" \
                 "nombre definitivo—, asi que casi seguro sigue viva la version" \
                 "anterior. COMPROBARLO igualmente con /api/health antes de" \
                 "relanzar: cada archivo se sube con ese mismo baile de rm+mv," \
                 "y si el corte cayo justo en el hueco de app.js —milisegundos—" \
                 "el sitio se queda sin punto de entrada y no responde. Si es" \
                 "asi, relanzar el workflow lo repone."
            exit 1
          fi

          if [ "$codigo" != 0 ]; then
            echo "lftp fallo con codigo $codigo (mirar su mensaje aqui arriba)."
            exit "$codigo"
          fi

          echo "Subido. El cron del servidor aplicara el paquete en menos de un minuto."

      # LO QUE FALTABA: comprobar que se desplegó.
      #
      # Hasta hoy el workflow terminaba en el `echo` de arriba. Y sin embargo
      # `/api/health` ya publicaba TODO lo necesario para saberlo —`version`
      # (el SHA del paquete que de verdad corre), `coherencia` y `despliegue`—
      # justamente porque el 2026-08-15 se perdio media hora sin poder saber
      # que version estaba viva. El conocimiento estaba; lo que faltaba era que
      # alguien preguntara sin que se lo pidieran.
      #
      # La regla que esto convierte en garantia: **el color del run NO dice si
      # se desplegó, lo dice `/api/health`.** Subir no es desplegar. Entre una
      # cosa y otra estan el cron, la descompresion, las migraciones y el
      # reinicio, y cualquiera de los tres ultimos incidentes cabe justo ahi.
      #
      # POR QUE NO FALLA EN ROJO A LA PRIMERA: el cron pasa cada minuto y el
      # intercambio no es instantaneo. Se pregunta cada 15 s hasta 7 minutos,
      # que es veinte veces lo que tarda un despliegue sano.
      #
      # SI ESTO FALLA, la version anterior sigue sirviendo (el paquete se aplica
      # entero o no se aplica). Lo que dice el fallo es «no llego», no «se
      # rompio»: el sitio esta vivo con el codigo de antes.
      - name: Comprobar que la version nueva esta viva
        timeout-minutes: 10
        env:
          # El dominio es publico y ya figura en el README, asi que no es un
          # secreto; se admite `APP_URL` por si algun dia hay otro entorno.
          BASE: ${{ secrets.APP_URL || 'https://gcm.drcaceresruiz.com' }}
        run: |
          esperado="${GITHUB_SHA}"
          echo "Se espera que /api/health cante la version ${esperado}."

          # SIN `jq`, Y ESTO NO ES PUREZA: la primera version leia el JSON con
          # `jq` y se probo en una maquina que no lo tenia. No dijo «falta jq»
          # —dijo `version='sin respuesta'`, se comio los 7 minutos de espera y
          # acabo senalando al cron del servidor, que estaba perfectamente—.
          # Una comprobacion que al fallar acusa al sitio equivocado es peor que
          # no tenerla, y aqui la herramienta que falta y el despliegue que no
          # llega se veian exactamente igual.
          #
          # `jq` esta en ubuntu-latest, asi que en el CI habria funcionado. Pero
          # la respuesta es una linea de JSON plano con claves que salen una
          # sola vez: `sed` la lee sin depender de nada que pueda no estar.
          leer_campo() {
            printf '%s' "$1" \
              | sed -n 's/.*"'"$2"'"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p'
          }

          cuerpo=""
          for intento in $(seq 1 28); do
            # `|| true` para que un corte de red no mate el paso: lo que manda
            # es el veredicto de abajo, no una peticion suelta.
            cuerpo="$(curl -fsS --max-time 20 "$BASE/api/health" 2>/dev/null || true)"

            version="$(leer_campo "$cuerpo" version)"
            despliegue="$(leer_campo "$cuerpo" despliegue)"

            if [ "$version" = "$esperado" ] && [ "$despliegue" = "al dia" ]; then
              echo "Desplegado y vivo: version ${version}, despliegue ${despliegue}."
              printf '%s\n' "$cuerpo"
              exit 0
            fi

            echo "Intento ${intento}/28: version='${version:-sin respuesta}'" \
                 "despliegue='${despliegue:-?}'. Se reintenta en 15 s."
            sleep 15
          done

          echo ""
          echo "NO se pudo confirmar el despliegue en 7 minutos."
          echo "Ultima respuesta de ${BASE}/api/health:"
          printf '%s\n' "${cuerpo:-(sin respuesta)}"
          echo ""
          echo "Como se lee esto:"
          echo "  - version distinta del SHA y despliegue 'pendiente' -> el paquete"
          echo "    llego pero el CRON no lo aplico. Mirar la linea del cron de"
          echo "    desplegar.sh en cPanel y tmp/despliegue.log."
          echo "  - sin respuesta o estado 'error' -> el sitio no contesta o perdio"
          echo "    la base. Eso NO lo causa una subida a medias; mirar el servidor."
          echo "  - coherencia 'desfasado' -> el FTP dejo app.js de la version nueva"
          echo "    y el paquete sigue sin aplicarse. Mismo sitio: el cron."
          echo ""
          echo "La version anterior sigue sirviendo: el paquete se aplica entero o no se aplica."
          exit 1
