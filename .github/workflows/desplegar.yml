# Despliegue a cPanel.
#
# GCM no es un sitio de archivos: es una aplicacion Next.js que hay que
# compilar y cuyo proceso Node hay que reiniciar. Por eso la compilacion se
# hace aqui y por FTP viaja solo el resultado, no el codigo fuente.
#
# La configuracion real (DATABASE_URL, APP_SECRET) NO viaja: vive en cPanel,
# en las variables de entorno de la aplicacion Node.
name: Desplegar a cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      limpiar:
        description: >-
          Borrar del servidor lo que sube este workflow antes de subirlo.
          Necesario si un despliegue quedo a medias: mirror compara por
          tamano y fecha, da por buenos los archivos truncados y los salta.
        type: boolean
        default: false

# Dos despliegues simultaneos dejarian el servidor con archivos de dos
# compilaciones distintas mezclados a mitad de subida.
concurrency:
  group: despliegue-produccion
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Un presupuesto mal calculado no debe llegar a produccion.
      - name: Pruebas
        run: npx vitest run

      - name: Compilar
        # Valores de relleno, no credenciales. `src/lib/env.ts` valida el
        # entorno al importarse y aborta si falta DATABASE_URL o APP_SECRET;
        # el runner no tiene .env, asi que sin esto el build ni arranca.
        # No llegan al servidor: la configuracion real esta en cPanel.
        env:
          DATABASE_URL: mysql://compilacion@127.0.0.1:3306/compilacion
          APP_SECRET: relleno-de-compilacion-sin-valor-real-32ch
        run: npm run build

      # `output: "standalone"` deja en .next/standalone un servidor
      # autocontenido con sus dependencias, pero los estaticos y public
      # quedan fuera y hay que colocarlos en su sitio.
      - name: Armar el paquete
        run: |
          mkdir -p deploy
          # -L dereferencia: el build deja enlaces simbolicos (rimraf y
          # @prisma/client) dentro de .next/node_modules, y ProFTPD no
          # soporta SITE SYMLINK. lftp fallaba al recrearlos y terminaba con
          # codigo 1 aunque el resto hubiera subido bien. Se copian como
          # archivos reales.
          cp -rL .next/standalone/. deploy/
          # El build de Next arrastra el .env dentro de standalone. En el
          # runner no deberia existir, pero si alguna vez aparece subiria
          # credenciales y pisaria la configuracion del servidor. Fuera.
          rm -f deploy/.env deploy/.env.*
          mkdir -p deploy/.next/static
          cp -r .next/static/. deploy/.next/static/
          if [ -d public ]; then cp -r public deploy/public; fi
          # cPanel genera su propio `app.js` como arranque y su configuracion
          # de Passenger puede seguir apuntando ahi aunque en el panel se
          # elija `server.js`. Se envia un app.js que solo delega, para que
          # la app levante apunte a donde apunte.
          echo "require('./server.js');" > deploy/app.js
          # Passenger reinicia la aplicacion al detectar que este archivo
          # cambio. Sin esto el servidor seguiria sirviendo la version vieja.
          mkdir -p deploy/tmp
          date -u +"%Y-%m-%dT%H:%M:%SZ" > deploy/tmp/restart.txt

          # El servidor no admite enlaces simbolicos. Si queda alguno, mejor
          # parar aqui que descubrirlo a mitad de una subida de 60 MB.
          if [ -n "$(find deploy -type l)" ]; then
            echo "Quedan enlaces simbolicos en el paquete:"
            find deploy -type l
            exit 1
          fi

      # Sin esta guarda, un FTP_SERVER_DIR vacio haria que la accion
      # sincronizara contra la RAIZ del FTP y borrara de alli todo lo que no
      # este en el paquete: incluidos otros sitios alojados en la cuenta.
      - name: Comprobar que hay destino
        run: |
          if [ -z "${{ secrets.FTP_SERVER_DIR }}" ]; then
            echo "Falta el secreto FTP_SERVER_DIR (ruta de la app en cPanel," \
                 "con barra final). Se aborta para no sincronizar contra la" \
                 "raiz del FTP."
            exit 1
          fi

      # Se usa lftp y no una accion de FTP porque este ProFTPD resetea la
      # conexion de DATOS cuando va cifrada: la sesion se abre bien, lista
      # el directorio, y muere con ECONNRESET al primer `ensureDir`. lftp
      # permite separar los dos canales.
      #
      # ftp:ssl-force        -> control CIFRADO: la contrasena nunca viaja en claro.
      # ftp:ssl-protect-data -> datos SIN cifrar: es lo que evita el reset.
      #
      # El contenido que viaja es la compilacion de un repositorio publico y
      # el paquete no lleva ningun .env, asi que no hay nada secreto en el
      # canal de datos. Las credenciales, que si lo son, van protegidas.
      - name: Subir por FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

          # Las credenciales van en ~/.netrc y no en la linea de comandos:
          # asi no aparecen en la lista de procesos del runner. lftp lo lee
          # solo para resolver el usuario y la clave del `open`.
          umask 077
          printf 'machine %s\nlogin %s\npassword %s\n' \
            "$FTP_SERVER" "$FTP_USERNAME" "$LFTP_PASSWORD" > ~/.netrc
          chmod 600 ~/.netrc

          # SIN --delete a proposito. El primer despliegue lo llevaba y se
          # puso a borrar archivos que gestiona cPanel dentro del directorio
          # de la aplicacion (`app.js`, `stderr.log`), rompio el arranque de
          # Passenger y dejo la web en 503. Un espejo que borra no encaja con
          # un directorio que otro sistema tambien administra.
          #
          # A cambio se acumulan archivos de compilaciones viejas. No
          # estorban: el servidor de Next es autocontenido y solo carga lo
          # que su manifiesto referencia.
          #
          # `open` explicito: pasar el host como ultimo argumento de lftp no
          # llega a abrir la sesion y `mirror` falla con "Not connected".
          # `cmd:fail-exit` hace que un error corte el script en vez de
          # seguir y terminar con exito enganoso.
          # Solo lo que genera este workflow. NO se tocan `.env`, `storage`
          # ni lo que cPanel administra (stderr.log, su configuracion).
          LIMPIEZA=""
          if [ "${{ inputs.limpiar }}" = "true" ]; then
            LIMPIEZA="rm -rf .next; rm -rf node_modules; rm -rf public;"
            echo "Limpieza activada: se borran .next, node_modules y public."
          fi

          # SIN --continue. Reanudar transferencias parciales es justo lo que
          # dejo el servidor con archivos truncados que luego mirror daba por
          # buenos al comparar tamano y fecha.
          #
          # Se hace una segunda pasada: la primera puede dejar algun archivo
          # fuera si una conexion se corta, y la segunda solo sube lo que
          # falte, asi que cuesta segundos.
          lftp -c "
            set cmd:fail-exit true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data false;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set net:max-retries 3;
            set net:timeout 20;
            set net:reconnect-interval-base 5;
            set mirror:parallel-transfer-count 2;
            open '$FTP_SERVER';
            cd '$FTP_SERVER_DIR';
            $LIMPIEZA
            mirror --reverse --verbose --exclude-glob '.env' --exclude-glob '.env.*' --exclude 'storage/' ./deploy/ .;
            mirror --reverse --verbose --exclude-glob '.env' --exclude-glob '.env.*' --exclude 'storage/' ./deploy/ .;
            bye
          "

          rm -f ~/.netrc
